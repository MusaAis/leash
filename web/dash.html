<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0a0d1c" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#eaeef5" media="(prefers-color-scheme: light)">
<title>Bylaw dashboard</title>
<link rel="stylesheet" href="/arena.css">
<link rel="stylesheet" href="/dash.css">
</head>
<body>
<header class="topbar">
  <div class="wrap bar">
    <a class="brand" href="/" aria-label="Bylaw Arena">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="8.5" cy="14.5" r="5.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12.6 10.8 19.5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="20" cy="4.6" r="1.9" fill="currentColor"/></svg>
      <span class="brand-name">Bylaw</span>
      <span class="brand-sub">Dashboard</span>
    </a>
  </div>
</header>
<main class="wrap dash">
  <h1>Vault dashboard</h1>
  <p id="status" class="muted" role="status">Loading…</p>
  <section id="tiers" class="vaults" aria-label="Vaults"></section>
  <section id="panic" class="panic" hidden aria-label="Panic switch">
    <h2>Panic switch</h2>
    <p>Stops new attempts and pauses both vaults. Resume stays with the owner key.</p>
    <label for="token">Token</label>
    <input id="token" type="password" autocomplete="off" spellcheck="false">
    <button id="pause" type="button">Pause both vaults</button>
    <p id="panic-result" role="status"></p>
  </section>
</main>
<script src="/dash.js"></script>
</body>
</html>
